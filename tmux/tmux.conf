# General
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g escape-time 0
set -g mode-keys vi
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Ctrl+space prefix
unbind C-b
unbind Space
set -g prefix C-Space

# Mouse
set -g mouse on

# Clipboard
set -g set-clipboard external

# Fire focus event
set -g focus-events on

# Move panes
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Resize 5 steps with h,j,k,l
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Move window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Start window and pane at 1 (default 0)
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows 1

# Clear terminal title
set -g set-titles on
set -g set-titles-string ""

# Claude session indicator
set -g @claude_color_busy '#e0af68' # Yellow ● -> Busy
set -g @claude_color_wait '#f7768e' # Red ● -> Blocked
set -g @claude_color_idle '#9ece6a' # Green ● -> Idle
set -g @claude_color_current '#cdcdd6'
set -g @claude_session_label 'index'

# Sort sessions by name
bind s choose-tree -sZ -O name -F '#{E:@claude_tree_format}'

# Status Bar
set-option -g status on
set-option -g status-position top
set -g status-interval 5
set -g status-justify absolute-centre
set -g monitor-activity on
set -g automatic-rename on
set -g pane-border-style 'fg=#3d3d52'
set -g pane-active-border-style 'fg=#a0a0c0'
set -g status-style 'fg=#606079'
set -g message-style 'fg=black bg=white'
set -g mode-style 'fg=#cdcdd6 bg=#3d3d52'
set -g status-left ''
set -g status-right '#S#{?@claude_sessions, | ,}#{claude_sessions} '
set -g status-right-length 80
set -g window-status-activity-style 'bold'
set -g window-status-format ' #I:#W#{claude_dot} '
set -g window-status-current-format '#[fg=white] #I:#W#{claude_dot} '

# Must come after the status formats above — the plugin reads them to place the dots
run-shell ~/.config/tmux/plugins/tmux-claude-status/claude-status.tmux
